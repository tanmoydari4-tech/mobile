    <script>
      // Automatic fallback when deployed directly from 'main' branch root on GitHub Pages
      window.addEventListener('DOMContentLoaded', function () {
        var isViteDev = !!document.querySelector('script[src*="@vite/client"]');
        var isBuiltDist = !!document.querySelector('script[src*="assets/index-"]');
        if (!isViteDev && !isBuiltDist) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './gh-bundle/app.css';
          document.head.appendChild(link);

          var script = document.createElement('script');
          script.type = 'module';
          script.src = './gh-bundle/app.js';
          document.body.appendChild(script);
        }
      });
    </script>
